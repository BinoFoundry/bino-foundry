[build]
  # Netlify auto-detected a monorepo and tried building inside frontend/, where
  # the npm workspace commands below don't resolve. Pin the base to the repo
  # root. If Netlify's UI "package directory" still wins, clear it there.
  base = ""
  command = "npm run build -w @bino-foundry/shared && npm run build -w @bino-foundry/frontend"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  # 22, not 20: @supabase/supabase-js needs a native WebSocket, which Node only
  # gained in 22. On 20 every database route failed with
  # "Node.js 20 detected without native WebSocket support".
  NODE_VERSION = "22"
  # Served under /design on the New Chapter storefront, so assets must be
  # requested from there rather than colliding with the storefront own /assets.
  # vite.config.ts reads this; App.tsx mirrors it as the router basename.
  BASE_PATH = "/design/"
  # NODE_VERSION only sets the *build* runtime. Functions run on their own
  # Lambda runtime, which stayed on 20 and kept failing, so pin it too.
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  # The app needs NODE_ENV=production at runtime, but npm reads the same
  # variable at install time and skips devDependencies — which is where
  # typescript and vite live, so the build died with `tsc: not found`.
  NPM_FLAGS = "--include=dev"
  # ADMIN_API_KEY is intentionally compiled into the SPA — the admin UI sends it
  # as `x-api-key` on catalogue writes, so it is a guard rather than a secret.
  # Without this exemption Netlify's secret scanner finds it in the bundle and
  # fails the deploy.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_API_KEY"

[functions]
  node_bundler = "esbuild"
  # sharp ships native binaries that cannot be bundled; Netlify installs it
  # alongside the function instead. Used only by the frame-crop export.
  external_node_modules = ["sharp"]
  included_files = ["backend/src/**"]

# The SPA calls same-origin /api/*, which lands here rather than on a server.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Client-side routes (/bracelet, /admin, …) must serve index.html, not 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed build assets never change content, so cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
