# Bino Foundry — binofoundry.temukreatif.id
# Document root: /var/www/bino-foundry (publish with scripts/sync-web-root.sh)
# API: 127.0.0.1:5050 (app install under /opt/bino-foundry)
#
# Install:
#   sudo cp deploy/nginx/binofoundry.temukreatif.id.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/binofoundry.temukreatif.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d binofoundry.temukreatif.id

upstream bino_api {
  server 127.0.0.1:5050;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name binofoundry.temukreatif.id;

  root /var/www/bino-foundry;
  index index.html;

  client_max_body_size 55m;

  location /api/ {
    proxy_pass http://bino_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
