# Example nginx site — SPA + API reverse proxy (vendor-neutral VPS).
# Install static files from frontend/dist to /var/www/bino-foundry
# Run API on 127.0.0.1:5050 (PM2/systemd/Docker).

upstream bino_api {
  server 127.0.0.1:5050;
  keepalive 8;
}

server {
  listen 80;
  server_name app.example.com;

  # Redirect to TLS in production (certbot / acme.sh)
  # return 301 https://$host$request_uri;

  root /var/www/bino-foundry;
  index index.html;

  client_max_body_size 55m;

  location /api/ {
    proxy_pass http://bino_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

