# Production nginx — binofoundry.temukreatif.id (HTTP → HTTPS + SPA fallback)
# Use after Let's Encrypt cert exists (see deploy/VPS_SETUP.md § Certbot reset).
#
#   sudo cp .../binofoundry.temukreatif.id.https.conf /etc/nginx/sites-available/binofoundry.temukreatif.id.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream bino_api {
  server 127.0.0.1:5050;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name binofoundry.temukreatif.id;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name binofoundry.temukreatif.id;

  ssl_certificate /etc/letsencrypt/live/binofoundry.temukreatif.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/binofoundry.temukreatif.id/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/bino-foundry;
  index index.html;

  client_max_body_size 55m;

  location /api/ {
    proxy_pass http://bino_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # SPA: /bracelet, /sunglasses, /admin must fall back to index.html on refresh
  location / {
    try_files $uri $uri/ /index.html;
  }
}
